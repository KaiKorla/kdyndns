[package]
name = "kdyndns"
version = "4.0.1"
edition = "2024"

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
async-trait = "0.1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "signal", "sync", "time"] }
listenfd = "1"
hickory-net = { version = "0.26", default-features = false, features = ["dnssec-ring", "tokio"] }
hickory-proto = { version = "0.26", default-features = false, features = ["dnssec-ring", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
